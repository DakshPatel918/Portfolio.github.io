name: Add relevant coursework section
on:
  push:
    paths:
      - '.github/workflows/add-coursework.yml'
permissions:
  contents: write
jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add coursework section
        run: echo '' | base64 -d > /tmp/coursework.py && python /tmp/coursework.py
      - name: Commit homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add relevant coursework to homepage"
          git push