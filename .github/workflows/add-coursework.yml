name: Add relevant coursework section
on:
  push:
    paths:
      - '.github/workflows/add-coursework.yml'
permissions:
  contents: write
jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add coursework section
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          nav='      <a href="#coursework">Coursework</a>\n'
          if '#coursework' not in s:
              marker='      <a href="#recommendations">Recommendations</a>'
              s=s.replace(marker, nav+marker)
          section='''
<section class="section alt" id="coursework">
  <div class="wrap">
    <div class="section-head reveal">
      <h2>Relevant Coursework</h2>
      <p>Selected business, finance, accounting, analytics, economics, and quantitative coursework completed at Loyola University Chicago.</p>
    </div>
    <div class="card-grid">
      <div class="card reveal" style="cursor:default;">
        <div class="proof-badge">Finance</div>
        <h3>Finance</h3>
        <p class="desc"><strong>FINC 334</strong> — Principles of Corporate Finance <span style="font-weight:700;">· A / 100%</span><br><strong>FINC 335</strong> — Investments</p>
        <a href="recommendation-wemhoff.html" class="btn btn-secondary" style="padding-left:0;">FINC 334 verification →</a>
      </div>
      <div class="card reveal" style="cursor:default;">
        <h3>Accounting & Taxation</h3>
        <p class="desc"><strong>ACCT 201</strong> — Introductory Accounting I<br><strong>ACCT 202</strong> — Introductory Accounting II<br><strong>ACCT 303</strong> — Intermediate Accounting I<br><strong>ACCT 328</strong> — Concepts in Taxation</p>
      </div>
      <div class="card reveal" style="cursor:default;">
        <h3>Economics</h3>
        <p class="desc"><strong>ECON 201</strong> — Principles of Microeconomics<br><strong>ECON 202</strong> — Principles of Macroeconomics<br><strong>ECON 303</strong> — Intermediate Microeconomics</p>
      </div>
      <div class="card reveal" style="cursor:default;">
        <h3>Analytics & Information Systems</h3>
        <p class="desc"><strong>INFS 247</strong> — Business Information Systems<br><strong>INFS 343</strong> — Business Analytics<br><strong>ISSCM 241</strong> — Business Statistics</p>
      </div>
      <div class="card reveal" style="cursor:default;">
        <h3>Operations & Management</h3>
        <p class="desc"><strong>SCMG 232</strong> — Introduction to Supply Chain Management<br><strong>MGMT 201</strong> — Managing People and Organizations</p>
      </div>
      <div class="card reveal" style="cursor:default;">
        <h3>Business Foundations</h3>
        <p class="desc"><strong>MARK 201</strong> — Principles of Marketing<br><strong>LREB 315</strong> — Law and the Regulatory Environment of Business I<br><strong>COMM 103</strong> — Business & Professional Speaking</p>
      </div>
      <div class="card reveal" style="cursor:default;">
        <h3>Quantitative Foundations</h3>
        <p class="desc"><strong>MATH 110</strong> — Business Precalculus<br><strong>MATH 130</strong> — Business Calculus</p>
      </div>
      <div class="card reveal" style="cursor:default;">
        <h3>Professional Development</h3>
        <p class="desc"><strong>QUIN 101</strong> — Business Learning and Careers<br><strong>QUIN 102</strong> — Financial Literacy and Well-Being<br><strong>QUIN 202</strong> — Career Preparation</p>
      </div>
    </div>
  </div>
</section>
'''
          if 'id="coursework"' not in s:
              marker='<section class="section" id="recommendations">'
              s=s.replace(marker, section+'\n'+marker)
          p.write_text(s)
          PY
      - name: Commit coursework update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Loyola relevant coursework section"
          git push