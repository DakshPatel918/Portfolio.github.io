name: Add recommendation section
on:
  push:
    paths:
      - '.github/workflows/add-recommendation.yml'
permissions:
  contents: write
jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Professor Wemhoff recommendation to homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          nav='''      <a href="#recommendations">Recommendations</a>\n'''
          if '#recommendations' not in s:
              marker='      <a href="#about">About</a>'
              s=s.replace(marker, nav+marker)
          section='''\n<section class="section" id="recommendations">\n  <div class="wrap">\n    <div class="section-head reveal">\n      <h2>Recommendations</h2>\n      <p>Academic perspective on my performance, work ethic, communication, and potential in finance.</p>\n    </div>\n    <div class="card reveal" style="max-width:820px;margin:0 auto;cursor:default;">\n      <div class="proof-badge">Verified recommendation</div>\n      <h3 style="font-size:1.5rem;margin:0 0 6px;">Professor Joseph A. Wemhoff</h3>\n      <p style="color:var(--text-dim);margin:0 0 24px;">Adjunct Instructor — Finance · Loyola University Chicago, Quinlan School of Business · FINC 334 — Principles of Corporate Finance</p>\n      <p style="font-size:1.15rem;line-height:1.65;margin:0 0 24px;">“Among the thousands of students whom I have taught the past ten years at the Quinlan School of Business, and among the thousands of individuals whom I have worked with in my forty-plus years in finance, Daksh Patel ranks in the top five percent.”</p>\n      <p style="color:var(--text-dim);font-size:.92rem;">Professor Wemhoff's July 9, 2026 letter notes an A with a perfect 100% score in FINC 334 and highlights mastery of corporate finance, work ethic, organization, communication, judgment, maturity, and professionalism.</p>\n      <div class="hero-cta" style="justify-content:flex-start;margin-top:24px;">\n        <a href="recommendation-wemhoff.html" class="btn btn-primary">View recommendation</a>\n        <a href="Recommendation%20Letter%20Daksh%20Patel.pdf" class="btn btn-secondary" target="_blank" rel="noopener">Original letter →</a>\n      </div>\n    </div>\n  </div>\n</section>\n'''
          if 'id="recommendations"' not in s:
              marker='<section class="section contact" id="contact">'
              s=s.replace(marker, section+'\n'+marker)
          p.write_text(s)
          PY
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Professor Wemhoff recommendation to homepage"
          git push