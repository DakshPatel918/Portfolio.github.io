name: Add internship availability section
on:
  push:
    paths:
      - '.github/workflows/add-internship-availability.yml'
permissions:
  contents: write
jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add internship availability to homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          nav='      <a href="#opportunities">Internships</a>\n'
          if '#opportunities' not in s:
              marker='      <a href="#contact">Contact</a>'
              s=s.replace(marker, nav+marker)
          section='''
<section class="section alt" id="opportunities">
  <div class="wrap">
    <div class="section-head reveal">
      <div class="proof-badge">Actively seeking internships</div>
      <h2>Open to Finance Internship Opportunities</h2>
      <p>I am actively pursuing internship opportunities where I can apply financial modeling, valuation, investment analysis, transaction analysis, portfolio analytics, and credit skills in a professional environment.</p>
    </div>
    <div class="card reveal" style="max-width:900px;margin:0 auto;cursor:default;">
      <h3 style="font-size:1.45rem;margin:0 0 10px;">Recruiting Availability</h3>
      <p style="color:var(--text-dim);margin:0 0 24px;">Available for internship opportunities across investment banking, private equity, asset management, wealth management, credit, corporate finance, and related finance roles.</p>
      <div class="skills-list" style="margin-bottom:28px;">
        <span>Fall 2026</span>
        <span>Winter 2027</span>
        <span>Summer 2027</span>
        <span>Fall 2027</span>
        <span>Winter 2028</span>
      </div>
      <div class="hero-cta" style="justify-content:flex-start;flex-wrap:wrap;">
        <a href="mailto:dakshpatel091805@gmail.com?subject=Finance%20Internship%20Opportunity" class="btn btn-primary">Contact me about an opportunity</a>
        <a href="Daksh_Patel_Resume.pdf" class="btn btn-secondary" target="_blank">View résumé →</a>
      </div>
    </div>
  </div>
</section>
'''
          if 'id="opportunities"' not in s:
              marker='<section class="section contact" id="contact">'
              s=s.replace(marker, section+'\n'+marker)
          p.write_text(s)
          PY
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add internship availability to portfolio"
          git push